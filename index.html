(function(){
 if (!window.KITTAndroid) return;
 let activeRecognition=null;
 let activeUtterance=null;
 function NativeRecognition(){this.onstart=null;this.onspeechstart=null;this.onspeechend=null;this.onresult=null;this.onerror=null;this.onend=null;this.lang='it-IT';}
 NativeRecognition.prototype.start=function(){activeRecognition=this;window.KITTAndroid.startSpeech();};
 NativeRecognition.prototype.abort=function(){window.KITTAndroid.stopSpeech();};
 NativeRecognition.prototype.stop=function(){window.KITTAndroid.stopSpeech();};
 window.__KITT_NATIVE_RECOGNITION=NativeRecognition;
 window.SpeechRecognition=NativeRecognition;
 window.webkitSpeechRecognition=NativeRecognition;
 window.__kittNativeRecStart=function(){if(activeRecognition && activeRecognition.onstart)activeRecognition.onstart();};
 window.__kittNativeSpeechStart=function(){if(activeRecognition?.onspeechstart)activeRecognition.onspeechstart();};
 window.__kittNativeSpeechEnd=function(){if(activeRecognition?.onspeechend)activeRecognition.onspeechend();};
 window.__kittNativeRecResult=function(text){
  if(!activeRecognition||!activeRecognition.onresult)return;
  const alt={transcript:String(text||''),confidence:1};
  const result=[alt];result.isFinal=true;
  activeRecognition.onresult({resultIndex:0,results:[result]});
 };
 window.__kittNativeRecError=function(error){if(activeRecognition && activeRecognition.onerror)activeRecognition.onerror({error:error||'no-speech'});};
 window.__kittNativeRecEnd=function(){if(activeRecognition?.onspeechend)activeRecognition.onspeechend();if(activeRecognition?.onend)activeRecognition.onend();};
 window.SpeechSynthesisUtterance=function(text){this.text=text;this.lang='it-IT';this.rate=1.03;this.pitch=.82;this.volume=1;this.onstart=null;this.onend=null;this.onerror=null;};
 window.__KITT_NATIVE_UTTERANCE=window.SpeechSynthesisUtterance;
 const nativeSynth={
  getVoices(){return [{name:'Voce italiana Android',lang:'it-IT'}]},
  cancel(){window.KITTAndroid.stopTts();activeUtterance=null;},
  resume(){},
  speak(u){activeUtterance=u;window.KITTAndroid.speak(u.text,u.rate,u.pitch);}
 };
 window.__KITT_NATIVE_TTS=nativeSynth;
 try{Object.defineProperty(window,'speechSynthesis',{value:nativeSynth,configurable:true});}
 catch(_){try{window.speechSynthesis=nativeSynth}catch(e){}}
 window.__kittNativeTtsStart=function(){if(activeUtterance?.onstart)activeUtterance.onstart();};
 window.__kittNativeTtsEnd=function(){if(activeUtterance?.onend)activeUtterance.onend();activeUtterance=null;};
 window.__kittNativeTtsError=function(){if(activeUtterance?.onerror)activeUtterance.onerror();activeUtterance=null;};
 window.__kittNativeResume=function(){
  // Simula il tocco di riattivazione senza cambiare pulsanti e grafica.
  try{document.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));}
  catch(e){document.dispatchEvent(new Event('pointerdown',{bubbles:true}));}
 };
})();

 if(scannerActive){

    const audioTime=window.kittScannerAudioTime?.();

<script>
/* KITT 1.4 — stessi toni puliti v1.3, accelerati di un ulteriore 3%.
   Solo accensione e suoi cinque attacchi; stessi pulsanti e stessa sequenza.
   Seguendo la posizione REALE di MediaPlayer, niente ritardi JS cumulativi.
   I cinque cambi/attacchi sono al ~2.32 / 2.81 / 3.32 / 3.96 / 4.93 s
   del video originale, ritagliato a 2.25 s; tempi ridotti del 5%
   per seguire il nuovo file riprodotto realmente da MediaPlayer.
   Microfono, scanner dei comandi e grafica restano invariati.
*/
(()=>{
 let completed=false, started=false, audioStartTime=0, frame=0, backupTimer=0, finishTimer=0;
 let onCompleted=()=>{};
 const oranges=[...document.querySelectorAll('svg .orangeButton')];
 const reds=[...document.querySelectorAll('svg .redButton')];
 const center=document.getElementById('centerButton');
 const cues=[
  {time:65,parts:[oranges[0],oranges[2]]},   // AIR + S1
  {time:517,parts:[oranges[1],oranges[3]]},  // OIL + S2
  {time:989,parts:[reds[0],reds[2]]},      // P1 + P3
  {time:1582,parts:[reds[1],reds[3]]},      // P2 + P4
  {time:2478,parts:[center]}                // NORMAL CRUISE
 ];
 let lastCue=-1;
 window.kittBootIsRunning=()=>!completed;
 window.kittAfterBoot=callback=>{
  if(completed){callback();return;}
  const earlier=onCompleted;onCompleted=()=>{earlier();callback();};
 };
 function endBoot(){
  if(completed)return;
  completed=true;
  cancelAnimationFrame(frame);
  clearTimeout(backupTimer);clearTimeout(finishTimer);
  document.body.classList.remove('kitt-booting');
  document.querySelectorAll('.kitt-boot-lit').forEach(el=>el.classList.remove('kitt-boot-lit'));
  onCompleted();
 }
 function update(){
  if(completed || !started)return;
  let elapsed=performance.now()-audioStartTime;
  if(window.KITTAndroid?.bootPositionMs){
   try{const actual=window.KITTAndroid.bootPositionMs();if(actual>=0)elapsed=actual;}catch(_){}
  }
  for(let i=lastCue+1;i<cues.length&&elapsed>=cues[i].time;i++){
   cues[i].parts.forEach(el=>el?.classList.add('kitt-boot-lit'));
   lastCue=i;
  }

  if(completed||started)return;
  started=true;audioStartTime=performance.now();

  backupTimer=setTimeout(endBoot,4550);

  if(completed)return;
  if(!started)startTimeline();

  if(completed)return;
  if(!started)startTimeline();

  try{window.KITTAndroid.playBootSound();}
  catch(_){window.__kittBootAudioFailed();}

})();

 function pickItalianVoice(){
  if(!synth)return null;
  const voices=synth.getVoices().filter(v=>/^it([-_]|$)/i.test(v.lang));
  return voices.find(v=>/\b(male|maschio|uomo|luca|giorgio|andrea|diego)\b/i.test(v.name))
    ||voices.find(v=>/google/i.test(v.name))||voices[0]||null;
 }
 function animateVoice(isOn){
  window.kittSetSpeaking?.(isOn);
 }
 function stopRecognition(){
  clearTimeout(restartTimer);
  clearTimeout(recognitionWatchdog);
  window.kittSetUserSpeaking?.(false);
  if(recognizing&&recognition){try{recognition.abort()}catch(_){}}
 }
 function listenSoon(delay=650){
  clearTimeout(restartTimer);
  if(!wantListen||speaking||recognizing||document.hidden||!recognition)return;
  // Non riaprire il microfono mentre il suono dello scanner e' in riproduzione.
  const scannerRemaining=Math.max(0,scannerHoldUntil-Date.now());
  restartTimer=setTimeout(startListening,Math.max(delay,scannerRemaining+120));
 }
 function speak(text, finished, isGreeting=false){
  ++utteranceId;
  const jobId=utteranceId;
  if(ttsSupported){try{synth.cancel();synth.resume()}catch(_){}}
  clearTimeout(speechTask);
  speaking=true;
  stopRecognition();
  if(!ttsSupported){
   report('Sintesi vocale non disponibile.');
   speaking=false; if(isGreeting)hasGreeted=true;
   if(typeof finished==='function')finished(false);
   listenSoon();return;
  }
  const u=window.KITTAndroid?new window.__KITT_NATIVE_UTTERANCE(text):new SpeechSynthesisUtterance(text);
  u.lang='it-IT';u.rate=1.03;u.pitch=.82;u.volume=1;
  const voice=pickItalianVoice();if(voice)u.voice=voice;
  let finishedThis=false, began=false;
  function finish(completed){
   if(finishedThis||jobId!==utteranceId)return;
   finishedThis=true;clearTimeout(speechTask);
   speaking=false;animateVoice(false);
   // Per i comandi la sequenza dello scanner parte SOLO dall'evento
   // onend di una frase realmente pronunciata, mai da un errore TTS.
   if(typeof finished==='function')finished(completed===true && began);
   listenSoon();
  }
  u.onstart=()=>{
   if(jobId!==utteranceId)return;
   began=true;if(isGreeting)hasGreeted=true;
   animateVoice(true);report('KITT: '+text);
  };
  u.onend=()=>finish(true);
  u.onerror=()=>{report('La voce non è partita: controlla audio e voce italiana.');finish(false)};
  // Se Chrome non avvia la voce, NON avviare lo scanner in anticipo.
  speechTask=setTimeout(()=>{
   if(!began&&jobId===utteranceId){try{synth.cancel()}catch(_){}finish(false)}
  },4000);
  try{synth.speak(u)}catch(_){finish(false)}
 }
 function sayGreeting(fromTouch=false){
  if(hasGreeted)return;
  if(!fromTouch&&speaking)return;
  speak(greeting,()=>listenSoon(),true);
 }
 function openPage(url){
  // Navigazione nella stessa scheda: evita il blocco dei popup di Chrome.
  // Al ritorno con il tasto Indietro prova a riprendere l'ascolto.
  try{
   if(startedByTouch&&wantListen)sessionStorage.setItem(kittReturnKey,'1');
  }catch(_){}
  if(window.KITTAndroid){window.KITTAndroid.openDestination(url);return;}
  window.location.assign(url);
 }
 // Sequenza rigorosa: voce completa -> breve pausa -> scanner+suono per 5 s -> apertura.
 // Durante il parlato lo scanner rimane completamente spento.
 function replyThenScanner(message, url=null, durationMs=5000){
  const sequence=++scannerSequence;
  window.kittStopScanner?.();
  speak(message,(spokenToEnd)=>{
   if(sequence!==scannerSequence)return;
   if(!spokenToEnd){
    // Una voce non riprodotta NON deve attivare lo scanner prima del parlato.
    scannerHoldUntil=0;
    report('Attendo la voce di KITT: scanner non avviato.');
    return;
   }
   const afterVoicePauseMs=250;
   // Il microfono rimane fermo anche durante la pausa e il suono.
   scannerHoldUntil=Date.now()+afterVoicePauseMs+durationMs+150;
   setTimeout(()=>{
    if(sequence!==scannerSequence)return;
    // Lo scanner si attiva solo DOPO l'evento onend della voce.
    window.kittAuthorizeCommandScanner?.();
    window.kittStartScanner?.(durationMs);
    setTimeout(()=>{
     if(sequence!==scannerSequence)return;
     window.kittStopScanner?.();
     scannerHoldUntil=0;
     if(url)openPage(url);
     else listenSoon(300);
    },durationMs);
   },afterVoicePauseMs);
  });
 }
 // Una risposta normale NON avvia lo scanner e NON riproduce il suono.
 // Lo scanner e' riservato alle azioni esplicite come "apri", "avvia" o "attiva".
 function replyConversation(message){
  ++scannerSequence;
  scannerHoldUntil=0;
  window.kittStopScanner?.();
  window.kittRevokeScanner?.();
  speak(message,()=>{
   // Anche dopo la fine del parlato una risposta informativa deve restare silenziosa.
   ++scannerSequence;
   scannerHoldUntil=0;
   window.kittStopScanner?.();
   window.kittRevokeScanner?.();
  });
 }
 function performCommand(raw){
  const line=raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  report('Hai detto: '+raw);
  const hasWake=/(^| )ki+t+( |$)/.test(line)||/(^| )kit( |$)/.test(line);
  // Riconosce anche comandi espliciti senza ripetere sempre "KITT".
  // Le frasi casuali restano ignorate fuori dalla breve finestra di dialogo.
  const directCommand=/^(?:apri|avvia|lancia|vai su|mostra|portami su|cerca su|che ore|che ora|attiva|accendi|spegni|ferma|stop|arresta)\b/.test(line);
  if(!hasWake&&Date.now()>wakeUntil&&!directCommand)return;
  if(hasWake)wakeUntil=Date.now()+10000;
  const command=line.replace(/\b(?:kitt|kit)\b/g,'').trim();
  if(!command){
   speak('Ti ascolto, Luciano.');return;
  }
  if(/(?:youtube|you tube|iu tub|iutub)/.test(command)&&/^(?:apri|avvia|lancia|vai su|mostra|portami su|cerca su)\b/.test(command)){
   replyThenScanner('Ok Luciano, apro YouTube.',window.KITTAndroid?'kittapp:YouTube':'https://m.youtube.com/',5000);
   return;
  }
  if(/(?:maps|mappe|navigatore)/.test(command)&&/^(?:apri|avvia|lancia|vai su|mostra|portami su)\b/.test(command)){
   replyThenScanner('Ok Luciano, apro Google Maps.',window.KITTAndroid?'kittapp:Maps':'https://www.google.com/maps',5000);
   return;
  }
  if(/(?:che ore|che ora|dimmi l ora|orario)/.test(command)){
   const time=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
   replyConversation('Luciano, sono le '+time+'.');return;
  }
  if(/(?:come stai|tutto bene|come va)/.test(command)){
   replyConversation('Tutti i sistemi sono operativi, Luciano. Direi che sto benissimo!');return;
  }
  if(/(?:ciao|salutami|buongiorno|bentornato)/.test(command)){
   replyConversation(greeting);return;
  }
  if(/(?:spegni|ferma|stop|arresta)/.test(command)&&/(?:scanner|scia|luce)/.test(command)){
   ++scannerSequence;scannerHoldUntil=0;
   window.kittStopScanner?.();
   speak('Scanner disattivato, Luciano.');return;
  }
  if(/(?:attiva|accendi|avvia|mostra)/.test(command)&&/(?:scanner|scia|luce)/.test(command)){
   replyThenScanner('Scanner attivato, Luciano.',null,12000);return;
  }
  if(/(?:grazie|bravo)/.test(command)){
   replyConversation('Sempre a tua disposizione, Luciano.');return;
  }
  // Il comando resta lo stesso, ma tollera anche "apri l'applicazione...".
  const appCommand=command.match(/^(?:apri|avvia|lancia|aprite)\s+(?:(?:l|la|il)\s+)?(?:applicazione\s+|app\s+)?(?:di\s+|del\s+)?(.+)$/);
  if(window.KITTAndroid && appCommand && appCommand[1]){
   const appName=appCommand[1].trim();
   replyThenScanner('Ok Luciano, apro '+appName+'.','kittapp:'+encodeURIComponent(appName),5000);
   return;
  }
  replyConversation('Ti ascolto, Luciano. Per ora posso aprire le tue app e rispondere ad alcune domande. La conversazione libera con intelligenza artificiale richiede ancora un collegamento dedicato.');
 }
 function startListening(){
  clearTimeout(restartTimer);
  if(Date.now()<scannerHoldUntil){listenSoon(200);return;}
  if(!recognition||!wantListen||recognizing||speaking||document.hidden)return;
  try{
   recognizing=true;
   recognition.start();
   report('KITT in ascolto.');
   clearTimeout(recognitionWatchdog);
   // Seconda protezione: se il bridge Android perde gli eventi, ritenta.
   if(window.KITTAndroid)recognitionWatchdog=setTimeout(()=>{
    if(!recognizing||speaking||document.hidden||!wantListen)return;
    report('Riattivo il microfono dopo un ascolto bloccato.');
    try{recognition.abort()}catch(_){}
    recognizing=false;
    listenSoon(1300);
   },15500);
  }catch(err){
   clearTimeout(recognitionWatchdog);
   recognizing=false;
   report('Non riesco ad avviare il microfono: '+(err.message||err));
   listenSoon(1800);
  }
 }
 if(R){
  recognition=new R();
  recognition.lang='it-IT';recognition.interimResults=false;
  recognition.continuous=false;recognition.maxAlternatives=1;
  recognition.onstart=()=>{autoResuming=false;};
  // PURSUIT soltanto mentre Luciano sta pronunciando il comando.
  recognition.onspeechstart=()=>{if(!speaking)window.kittSetUserSpeaking?.(true);};
  recognition.onspeechend=()=>{window.kittSetUserSpeaking?.(false);};
  recognition.onresult=event=>{
   window.kittSetUserSpeaking?.(false);
   const bits=[];
   for(let i=event.resultIndex;i<event.results.length;i++){
    if(event.results[i].isFinal)bits.push(event.results[i][0].transcript);
   }
   const said=bits.join(' ').trim();if(said)performCommand(said);
  };
  recognition.onerror=event=>{
   clearTimeout(recognitionWatchdog);
   window.kittSetUserSpeaking?.(false);
   lastError=event.error||'';
   report('Microfono: '+lastError);
   if(lastError==='not-allowed'||lastError==='service-not-allowed'){
    wantListen=false;
    // Chrome potrebbe richiedere un nuovo tocco dopo il tasto Indietro.
    // Non mostrare un avviso invasivo per un tentativo automatico.
    if(!autoResuming){
     alert('KITT ha bisogno del microfono. Consenti il microfono nelle impostazioni del sito di Chrome, poi tocca di nuovo la plancia.');
    }else{
     report('Tocca una volta la plancia per riattivare il microfono.');
    }
   }
   autoResuming=false;
  };
  recognition.onend=()=>{
   clearTimeout(recognitionWatchdog);
   window.kittSetUserSpeaking?.(false);
   recognizing=false;
   if(wantListen&&!speaking){
    listenSoon(lastError==='network'?5000:850);
   }
  };
 }
 function startFromTouch(){
  if(window.kittBootIsRunning?.())return;
  if(!recognition){
   if(!startedByTouch){alert('Per dare comandi a KITT serve Google Chrome su Android con il riconoscimento vocale disponibile.');}
   startedByTouch=true;
   if(!hasGreeted)sayGreeting(true);
   return;
  }
  startedByTouch=true;wantListen=true;lastError='';autoResuming=false;
  if(!hasGreeted){sayGreeting(true)}
  else if(!speaking){
   // Un tocco sulla plancia forza il recupero se l'ascolto era bloccato.
   if(recognizing){
    stopRecognition();
    recognizing=false;
    listenSoon(500);
   }else startListening();
  }
 }
 // La prima interazione abilita il sistema vocale. Non sono aggiunti pulsanti.
 document.addEventListener('pointerdown',startFromTouch,{passive:true});
 document.addEventListener('keydown',event=>{
  if(event.key==='Enter'||event.key===' '){startFromTouch()}
 });
 // Chrome può sospendere il riconoscimento anche se la pagina è mantenuta
 // in memoria (Back/Forward Cache). Sblocca lo stato locale e ritenta.
 function resumeVoiceAfterBack(){
  if(!wantListen||document.hidden)return;
  if(recognizing&&recognition){try{recognition.abort()}catch(_){}}
  clearTimeout(recognitionWatchdog);
  recognizing=false; lastError='';autoResuming=true;
  listenSoon(700);
 }
 document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopRecognition();recognizing=false;}
  else if(wantListen){resumeVoiceAfterBack()}
 });
 window.addEventListener('pageshow', event=>{
  if(event.persisted||returningToKitt){
   try{sessionStorage.removeItem(kittReturnKey)}catch(_){}
   if(wantListen)resumeVoiceAfterBack();
  }
 });
 // Su una navigazione normale: saluta come prima. Se torna da YouTube/Maps:
 // non ripetere il saluto, tenta invece di riaprire il microfono.
 window.addEventListener('load',()=>{
  if(returningToKitt){resumeVoiceAfterBack();}
  else if(window.kittAfterBoot)window.kittAfterBoot(()=>sayGreeting(false));
  else sayGreeting(false);
 },{once:true});
})();
</script>
</body></html>
