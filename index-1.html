const rects=[],sheenRects=[];
for(let i=0;i<N;i++){

}
// Scanner rosso: resta spento, parte solo dopo un comando vocale riconosciuto.
let scannerActive=false, scannerStopAt=0;
function setScanner(active, durationMs=6500){
 scannerActive=!!active;
 if(scannerActive)scannerStopAt=performance.now()+durationMs;
 g.style.display=scannerActive?'':'none';
 scanGlow.style.display=scannerActive?'':'none';
 scanSheen.style.display=scannerActive?'':'none';
}
window.kittStartScanner=(ms=6500)=>setScanner(true,ms);
window.kittStopScanner=()=>setScanner(false);
function tick(t){
 if(scannerActive){
  if(t>=scannerStopAt){setScanner(false)}
  else{
   // Il movimento, la scia, le dimensioni e i colori rimangono identici.
   const cycle=(t/1800)%2,forward=cycle<1,position=forward?cycle:2-cycle;
   const packetLeft=LEFT+position*(RIGHT-LEFT-PACKET_WIDTH);
   const center=packetLeft+PACKET_WIDTH/2,pulse=.5+.5*Math.sin(t/440);
   scanGlow.setAttribute('transform','translate('+center+' 0)');
   scanGlow.setAttribute('opacity',(.20+.13*pulse).toFixed(3));
   rects.forEach((r,i)=>{
    const place=forward?N-1-i:i,px=packetLeft+place*STEP;
    r.setAttribute('x',px);sheenRects[i].setAttribute('x',px);
   });
  }
 }
 requestAnimationFrame(tick);
}
setScanner(false);
requestAnimationFrame(tick);

<script>
/* Comandi vocali locali: nessuna chiave API, nessuna modifica estetica alla plancia.
   Prima attivazione: un tocco nello schermo può essere richiesto da Android Chrome.
   Il riconoscimento vocale di Chrome richiede rete e autorizzazione microfono.

(()=>{

 function report(message){status.textContent=message;console.log('[KITT]',message)}
 function pickItalianVoice(){
  if(!synth)return null;
  const voices=synth.getVoices().filter(v=>/^it([-_]|$)/i.test(v.lang));
  return voices.find(v=>/\b(male|maschio|uomo|luca|giorgio|andrea|diego)\b/i.test(v.name))
    ||voices.find(v=>/google/i.test(v.name))||voices[0]||null;
 }

  window.kittSetSpeaking?.(isOn);

  clearTimeout(restartTimer);
  if(recognizing&&recognition){try{recognition.abort()}catch(_){}}

  restartTimer=setTimeout(startListening,delay);

  ++utteranceId;

  if(ttsSupported){try{synth.cancel();synth.resume()}catch(_){}}

  stopRecognition();

   report('Sintesi vocale non disponibile.');

   if(jobId!==utteranceId)return;

 function openPage(url){
  // Navigazione nella stessa scheda: evita il blocco dei popup di Chrome.
  window.location.assign(url);

 function performCommand(raw){
  const line=raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  report('Hai detto: '+raw);
  const hasWake=/(^| )ki+t+( |$)/.test(line)||/(^| )kit( |$)/.test(line);
  if(!hasWake&&Date.now()>wakeUntil)return;
  if(hasWake)wakeUntil=Date.now()+10000;
  const command=line.replace(/\b(?:kitt|kit)\b/g,'').trim();
  if(!command){
   speak('Ti ascolto, Luciano.');return;
  }
  if(/(?:youtube|you tube|iu tub|iutub)/.test(command)&&/(?:apr|avvia|lancia|vai|mostra|youtube|cerca)/.test(command)){
   window.kittStartScanner?.(9500);
   speak('Ricevuto Luciano, apro YouTube.',()=>setTimeout(()=>openPage('https://m.youtube.com/'),250));
   return;
  }
  if(/(?:maps|mappe|navigatore)/.test(command)&&/(?:apr|avvia|lancia|vai|mostra|maps|mappe)/.test(command)){
   window.kittStartScanner?.(9500);
   speak('Ricevuto Luciano, apro Google Maps.',()=>setTimeout(()=>openPage('https://www.google.com/maps'),250));
   return;
  }
  if(/(?:che ore|che ora|dimmi l ora|orario)/.test(command)){
   window.kittStartScanner?.(5500);
   const time=new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
   speak('Luciano, sono le '+time+'.');return;
  }
  if(/(?:come stai|tutto bene|come va)/.test(command)){
   window.kittStartScanner?.(5500);
   speak('Tutti i sistemi sono operativi, Luciano.');return;
  }
  if(/(?:ciao|salutami|buongiorno|bentornato)/.test(command)){
   window.kittStartScanner?.(5500);
   speak(greeting);return;
  }
  if(/(?:spegni|ferma|stop|arresta)/.test(command)&&/(?:scanner|scia|luce)/.test(command)){
   window.kittStopScanner?.();
   speak('Scanner disattivato, Luciano.');return;
  }
  if(/(?:attiva|accendi|avvia|mostra)/.test(command)&&/(?:scanner|scia|luce)/.test(command)){
   window.kittStartScanner?.(12000);
   speak('Scanner attivato, Luciano.');return;
  }
  if(/(?:grazie|bravo)/.test(command)){
   window.kittStartScanner?.(4500);
   speak('Sempre a tua disposizione, Luciano.');return;
  }
  window.kittStartScanner?.(5000);
  speak('Ho ricevuto il comando, Luciano, ma non so ancora eseguirlo.');

    alert('KITT ha bisogno del microfono. Consenti il microfono nelle impostazioni del sito di Chrome, poi tocca di nuovo la plancia.');

  };

   recognizing=false;
   if(wantListen&&!speaking){
    listenSoon(lastError==='network'?5000:850);
   }
  };

  if(!recognition){
   if(!startedByTouch){alert('Per dare comandi a KITT serve Google Chrome su Android con il riconoscimento vocale disponibile.');}

  }
  startedByTouch=true;wantListen=true;lastError='';
  if(!hasGreeted){sayGreeting(true)}
